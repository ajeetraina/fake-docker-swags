# syntax=docker/sandbox-kit:3
# A shopper-simulator MIXIN: it layers a `shop` command onto any agent workload
# so the agent can "shop" a storefront and log where it gets stuck. The command
# is a stdlib python runner that reads the store's catalog and reasons as a
# shopper via the agent's own LLM — no venv and no bundled browser, because
# neither travels cleanly as a build-time overlay (a venv's interpreter symlink
# dangles on a different base, and Chromium's native libs must live in the
# running base). The agent that drives it and its credential ride with the
# workload underneath.
schemaVersion: "3"
kind: mixin
displayName: Shopper simulator (shop)
author: "Ajeet Singh Raina"
description: >-
  Adds a `shop "<goal>" <url>` command that reasons over a storefront's catalog
  as a shopper and emits a JSON trace. Pure stdlib on the base's python3 — no
  venv, no Chromium — so it composes onto any agent workload.
sourceUrl: https://github.com/ajeetraina/fake-docker-swags
version: "0.2.0"

args:
  previewHost:
    default: "host.docker.internal:443"
    description: >-
      Host:port of the swag-store preview the simulator shops against. Override
      for a cloud run, e.g. a published preview hostname.

provides: ["browser-use@0.2.0"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # At run time the shopper reaches two things: the storefront it shops
      # (the preview host, an arg so a cloud run can point elsewhere) and the
      # LLM that reasons for it. api.anthropic.com is where the proxy injects
      # the agent's credential — the shopper never holds a key. No install
      # phase: the overlay ships two files and builds nothing.
      runtime:
        allow:
          - api.anthropic.com
          - "${{ kit.args.previewHost }}"

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./browser-use-context.md
