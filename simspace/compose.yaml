# Authoring environment for the Swag Lab simspace (slides + hands-on lab).
# Both services use the prebuilt Simspace authoring image and mount only the
# ./lab directory — you never need Node or the app source locally.
#
#   docker compose up dev              # live preview at http://localhost:5173
#   docker compose run --rm validate   # lint the labs (nonzero exit on errors)
#
# Pin SIMSPACE_AUTHORING_IMAGE to a released version for reproducible authoring,
# e.g. export SIMSPACE_AUTHORING_IMAGE=dockersamples/simspace-authoring:1
name: swag-lab-simspace

services:
  # Live preview. Edits to ./lab show on browser refresh.
  dev:
    image: ${SIMSPACE_AUTHORING_IMAGE:-dockersamples/simspace-authoring:latest}
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      # The dev server generates /labs.json from public/labs/*/labspace.yaml, so
      # mount our lab collection there (plural) for both cards to appear.
      - ./lab:/usr/local/app/public/labs

  # One-shot validator. Run with `docker compose run --rm validate`.
  validate:
    image: ${SIMSPACE_AUTHORING_IMAGE:-dockersamples/simspace-authoring:latest}
    profiles: ["tools"]
    command: npm run validate-lab -- /lab
    volumes:
      - ./lab:/lab:ro
