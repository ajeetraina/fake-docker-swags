name: Deploy store to GitHub Pages

# Builds the Vite store and publishes it to GitHub Pages, served at the custom
# domain fakestore.dockerworkshop.com (see store/public/CNAME). Runs on any
# change to the store so the live site tracks main.
on:
  push:
    branches: [main]
    paths:
      - "store/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: store/package-lock.json
      - name: Install
        working-directory: store
        run: npm ci
      - name: Build
        working-directory: store
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
